name: bugfix
description: Short cycle for a specific incident or bug — reproduction → root cause → fix with tests → postmortem
version: 0.3.0

phases:
  - id: codebase-analysis
    name: Code snapshot
    agent: __codebase__
    outputs:
      - .iagentek/current-state.md
    checkpoint:
      id: codebase-analyzed
      mode: auto
      prompt: |
        Code analysis generated so the Debugger has context.

  - id: triage-and-fix
    name: Debug, reproduction, root cause, and fix
    agent: debugger
    inputs:
      - .iagentek/current-state.md
      - user.bug_description
    outputs:
      - test/**/*
      - src/**/*
      - .iagentek/incidents/*.md
    checkpoint:
      id: incident-resolved
      mode: required
      prompt: |
        The Debugger reproduced the bug, identified the root cause,
        added a test that fails before the fix, and applied the minimal change.
        Review the postmortem at .iagentek/incidents/ and approve for QA.

  - id: validation
    name: QA of the fix
    agent: qa
    inputs:
      - .iagentek/incidents/*.md
      - .iagentek/DoD.md
    outputs:
      - .iagentek/qa/*-report.md
    checkpoint:
      id: qa-approved
      mode: required
      prompt: |
        QA validated the fix resolves the bug without regressions.
        Approve to release the hotfix.

  - id: release
    name: Hotfix release
    agent: devops
    inputs:
      - .iagentek/architecture.md
      - .iagentek/incidents/*.md
    outputs:
      - .iagentek/deployment.md
    checkpoint:
      id: release-approved
      mode: required
      prompt: |
        DevOps prepared the hotfix release plan.
        Check the runbook and approve the deploy.
