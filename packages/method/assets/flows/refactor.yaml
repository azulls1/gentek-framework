name: refactor
description: Cycle for tech-debt reduction — audit → prioritization → staged migration → safe execution
version: 0.3.0

phases:
  - id: codebase-analysis
    name: Code snapshot
    agent: __codebase__
    outputs:
      - .iagentek/current-state.md
    checkpoint:
      id: codebase-analyzed
      mode: auto
      prompt: |
        Code analysis complete.

  - id: debt-audit
    name: Debt audit + migration plan
    agent: refactor-architect
    inputs:
      - .iagentek/current-state.md
      - .iagentek/constitution.md
    outputs:
      - .iagentek/debt-audit.md
      - .iagentek/refactor-plans/*.md
    checkpoint:
      id: refactor-planned
      mode: required
      prompt: |
        The Refactor Architect identified real debt, prioritized top 5 (pain × effort)
        and designed staged plans with regression tests and documented rollback.
        Review and approve to decompose into stories.

  - id: planning
    name: Decomposition into stories and sprints
    agent: scrum-master
    inputs:
      - .iagentek/debt-audit.md
      - .iagentek/refactor-plans/*.md
    outputs:
      - .iagentek/stories/*.md
      - .iagentek/tasks/*.md
      - .iagentek/sprint-plan.md
    checkpoint:
      id: planning-approved
      mode: required
      prompt: |
        Scrum Master generated one story per plan stage.
        Verify the execution order and dependencies.

  - id: implementation
    name: Incremental execution per stage
    agent: dev
    inputs:
      - .iagentek/stories/*.md
      - .iagentek/tasks/*.md
      - .iagentek/refactor-plans/*.md
    outputs:
      - src/**/*
      - test/**/*
    checkpoint:
      id: story-done
      mode: required
      prompt: |
        Dev executed the plan stages, keeping tests green at each step.
        Verify that NO new features were introduced.

  - id: validation
    name: Regression QA
    agent: qa
    inputs:
      - .iagentek/stories/*.md
      - .iagentek/refactor-plans/*.md
    outputs:
      - .iagentek/qa/*-report.md
    checkpoint:
      id: qa-approved
      mode: required
      prompt: |
        QA confirmed system behavior did NOT change from the
        user's perspective. Approve for release.

  - id: release
    name: Refactor release
    agent: devops
    inputs:
      - .iagentek/architecture.md
    outputs:
      - .iagentek/deployment.md
    checkpoint:
      id: release-approved
      mode: required
      prompt: |
        DevOps prepared deploy + rollback plan. Approve release.
