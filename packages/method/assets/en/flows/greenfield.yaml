name: greenfield
description: Full cycle for a brand-new product (no existing code)
version: 0.2.0

phases:
  - id: discovery
    name: Discovery & Problem Definition
    agent: analyst
    inputs:
      - user.idea
      - user.project_name
    outputs:
      - .iagentek/project-brief.md
      - .iagentek/constitution.md
    checkpoint:
      id: discovery-approved
      mode: required
      prompt: |
        The Analyst generated the project brief and the project constitution.
        Review the files and approve to continue to feature definition.
      summary_template: |
        Brief generated at .iagentek/project-brief.md
        Constitution at .iagentek/constitution.md
        Next step: PM generates the PRD and specs.

  - id: definition
    name: Product Definition (PRD + Specs)
    agent: pm
    inputs:
      - .iagentek/project-brief.md
      - .iagentek/constitution.md
    outputs:
      - .iagentek/PRD.md
      - .iagentek/specs/*.md
    checkpoint:
      id: specs-approved
      mode: required
      prompt: |
        The PM generated the PRD and a spec for each MUST feature.
        Review prioritization (MoSCoW) and the individual specs.
        Approve to continue to technical design.

  - id: design
    name: Technical Design
    agent: architect
    inputs:
      - .iagentek/project-brief.md
      - .iagentek/constitution.md
      - .iagentek/PRD.md
      - .iagentek/specs/*.md
    outputs:
      - .iagentek/architecture.md
      - .iagentek/plans/*.md
    checkpoint:
      id: architecture-approved
      mode: required
      prompt: |
        The Architect proposed the stack, structure, and technical plans per feature.
        Review the trade-offs and approve to continue.

  - id: planning
    name: Sprint Planning (Stories + Tasks)
    agent: scrum-master
    inputs:
      - .iagentek/PRD.md
      - .iagentek/specs/*.md
      - .iagentek/plans/*.md
      - .iagentek/architecture.md
      - .iagentek/constitution.md
    outputs:
      - .iagentek/stories/*.md
      - .iagentek/tasks/*.md
      - .iagentek/sprint-plan.md
      - .iagentek/DoD.md
    checkpoint:
      id: planning-approved
      mode: required
      prompt: |
        The Scrum Master decomposed specs into stories and atomic tasks.
        Review sprint-plan.md, the DoD, and the acceptance criteria.
        Approve to continue to implementation.

  - id: implementation
    name: Implementation
    agent: dev
    inputs:
      - .iagentek/stories/*.md
      - .iagentek/tasks/*.md
      - .iagentek/specs/*.md
      - .iagentek/plans/*.md
      - .iagentek/architecture.md
      - .iagentek/constitution.md
    outputs:
      - src/**/*
      - test/**/*
    checkpoint:
      id: story-done
      mode: required
      prompt: |
        The Dev implemented the stories and added tests.
        Review the generated code, run tests locally,
        and approve to continue to QA.

  - id: validation
    name: QA & Acceptance
    agent: qa
    inputs:
      - .iagentek/stories/*.md
      - .iagentek/specs/*.md
      - .iagentek/DoD.md
    outputs:
      - .iagentek/qa/*-report.md
    checkpoint:
      id: qa-approved
      mode: required
      prompt: |
        QA validated the ACs of each story and produced reports.
        Review verdicts and findings before release.

  - id: release
    name: Release Engineering
    agent: devops
    inputs:
      - .iagentek/architecture.md
      - .iagentek/constitution.md
    outputs:
      - .github/workflows/*
      - .iagentek/deployment.md
      - .env.example
    checkpoint:
      id: release-approved
      mode: required
      prompt: |
        DevOps prepared pipelines, infra, and deployment runbook.
        Review deployment.md and approve the release.
