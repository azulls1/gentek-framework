name: brownfield
description: Cycle for an existing product — analyze the code before planning changes
version: 0.2.0

phases:
  - id: codebase-analysis
    name: Existing-code analysis
    agent: __codebase__
    inputs:
      - codebase
    outputs:
      - .iagentek/current-state.md
    checkpoint:
      id: codebase-analyzed
      mode: auto
      prompt: |
        The analyzer scanned the existing code and generated current-state.md.
        Review the snapshot before moving to discovery.

  - id: discovery
    name: Discovery over existing code
    agent: analyst
    inputs:
      - .iagentek/current-state.md
      - user.idea
    outputs:
      - .iagentek/project-brief.md
      - .iagentek/constitution.md
    checkpoint:
      id: discovery-approved
      mode: required
      prompt: |
        The Analyst read current-state.md and produced a brief + constitution
        adapted to the existing project (not an ideal greenfield).
        Approve to continue.

  - id: definition
    name: Product Definition (PRD + Specs)
    agent: pm
    inputs:
      - .iagentek/current-state.md
      - .iagentek/project-brief.md
      - .iagentek/constitution.md
    outputs:
      - .iagentek/PRD.md
      - .iagentek/specs/*.md
    checkpoint:
      id: specs-approved
      mode: required
      prompt: |
        The PM prioritized features considering the existing code and debt.
        Review the MoSCoW and the specs.

  - id: design
    name: Technical design (over the existing architecture)
    agent: architect
    inputs:
      - .iagentek/current-state.md
      - .iagentek/PRD.md
      - .iagentek/specs/*.md
      - .iagentek/constitution.md
    outputs:
      - .iagentek/architecture.md
      - .iagentek/plans/*.md
    checkpoint:
      id: architecture-approved
      mode: required
      prompt: |
        The Architect proposed changes respecting the current architecture,
        explicitly marking what is modified and what is rewritten.

  - id: planning
    name: Sprint Planning
    agent: scrum-master
    inputs:
      - .iagentek/PRD.md
      - .iagentek/specs/*.md
      - .iagentek/plans/*.md
      - .iagentek/architecture.md
    outputs:
      - .iagentek/stories/*.md
      - .iagentek/tasks/*.md
      - .iagentek/sprint-plan.md
      - .iagentek/DoD.md
    checkpoint:
      id: planning-approved
      mode: required
      prompt: Approve stories and tasks to start implementation.

  - id: implementation
    name: Implementation
    agent: dev
    inputs:
      - .iagentek/stories/*.md
      - .iagentek/tasks/*.md
      - .iagentek/specs/*.md
      - .iagentek/plans/*.md
      - .iagentek/architecture.md
    outputs:
      - src/**/*
      - test/**/*
    checkpoint:
      id: story-done
      mode: required
      prompt: Review the generated code before moving to QA.

  - id: validation
    name: QA
    agent: qa
    inputs:
      - .iagentek/stories/*.md
      - .iagentek/specs/*.md
      - .iagentek/DoD.md
    outputs:
      - .iagentek/qa/*-report.md
    checkpoint:
      id: qa-approved
      mode: required
      prompt: Review QA reports before release.

  - id: release
    name: Release Engineering
    agent: devops
    inputs:
      - .iagentek/architecture.md
      - .iagentek/constitution.md
    outputs:
      - .github/workflows/*
      - .iagentek/deployment.md
    checkpoint:
      id: release-approved
      mode: required
      prompt: Approve the release plan.
