name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel older runs of the same PR if a new commit is pushed
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Sync LICENSE into packages
        run: npm run sync:license

      - name: Build all workspaces
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify CLI binary works
        run: node packages/cli/dist/bin/gentek.js --version

  pack-dry-run:
    name: Verify npm publish artifacts
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sync:license
      - run: npm run build
      - name: Verify @gentek/method tarball
        run: npm pack --dry-run -w @gentek/method
      - name: Verify @gentek/core tarball
        run: npm pack --dry-run -w @gentek/core
      - name: Verify @gentek/cli tarball
        run: npm pack --dry-run -w @gentek/cli
